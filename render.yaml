services:
  - type: web
    name: ai-support-sales-copilot-backend
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: 1.0.0
      - key: ENABLE_API_DOCS
        value: false
      - key: DATA_DIR
        value: /var/data/ai-support-sales-copilot
      - key: DEFAULT_COMPANY_ID
        value: startup-demo-001
      - key: DEFAULT_ANSWER_MODE
        value: sales
      - key: REQUIRE_COMPANY_ID
        value: true
      - key: MAX_CHAT_HISTORY_MESSAGES
        value: 12
      - key: MAX_CHAT_MESSAGE_LENGTH
        value: 4000
      - key: MAX_UPLOAD_SIZE_BYTES
        value: 10485760
      - key: WEBSITE_SCRAPE_MAX_PAGES
        value: 6
      - key: WEBSITE_SCRAPE_TIMEOUT_SECONDS
        value: 10
      - key: WEBSITE_SCRAPE_USER_AGENT
        value: AI-Support-Sales-Copilot/1.0
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: CHAT_API_KEY
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
    disks:
      - name: ai-support-sales-copilot-data
        mountPath: /var/data/ai-support-sales-copilot
        sizeGB: 1
